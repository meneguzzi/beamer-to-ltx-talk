name: CI

# Two jobs: syntax-check needs no LaTeX toolchain (scripts must at least parse
# cleanly); latex-fixtures compiles the minimal worked examples in
# tests/fixtures/ against a real TeX Live + ltx-talk. Testing a whole real
# course of decks is still a manual pre-release step (see SKILL.md) -- too
# heavy for every push -- but the small per-construct fixtures are cheap
# enough to run here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Parse-check all scripts
        run: |
          set -e
          for f in scripts/*.py; do
            echo "checking $f"
            python3 -W error::SyntaxWarning -c "import ast; ast.parse(open('$f').read())"
          done

      - name: convert_deck.py --help works
        run: python3 scripts/convert_deck.py --help

      - name: Lint a synthetic fixture (exercises --lint end to end)
        run: |
          cat > /tmp/fixture.tex <<'EOF'
          \documentclass{beamer}
          \begin{document}
          \begin{frame}{A title}
          \onslide<2>{Some text} & more \\
          \end{frame}
          \end{document}
          EOF
          # Expected to exit 1 (findings present) -- that's success for this check.
          if python3 scripts/convert_deck.py /tmp/fixture.tex --lint; then
            echo "expected --lint to flag the synthetic fixture, but it passed clean" >&2
            exit 1
          fi

      # convert_deck.py's docstring and SKILL.md Step 2 both promise idempotence, and
      # nothing checked it until #26 (a second run starred the closer of the first
      # ordinary frame after every frame* and broke the deck). Source-level only, so it
      # belongs in this job rather than the TeX Live one.
      - name: Converter is idempotent (tests/run_converter_idempotence.sh)
        run: bash tests/run_converter_idempotence.sh

      # The pixel probe's parser arm needs no LaTeX and no poppler, so it runs
      # here as well as in the TeX Live job: a wrong measurement is then a
      # 20-second failure rather than a four-minute one. The rendered arm skips
      # itself when lualatex and pdftoppm are absent, and runs in latex-fixtures.
      - name: Pixel probe self-test, parser arm (tests/run_pixel_probe_selftest.sh)
        run: bash tests/run_pixel_probe_selftest.sh

      - name: Lint C-HANDOUT-MODE (fires on before.tex, silent on after.tex)
        run: |
          set -e
          # NB: grep for the bracketed [C-HANDOUT-MODE] finding tag, not the bare
          # string -- the fixture's own directory name (tests/fixtures/C-HANDOUT-MODE/)
          # would otherwise false-match the --lint banner line that echoes the path.
          if ! python3 scripts/convert_deck.py tests/fixtures/C-HANDOUT-MODE/before.tex --lint 2>&1 | grep -q '\[C-HANDOUT-MODE\]'; then
            echo "expected --lint to flag C-HANDOUT-MODE on unqualified \\only sites" >&2
            exit 1
          fi
          if python3 scripts/convert_deck.py tests/fixtures/C-HANDOUT-MODE/after.tex --lint 2>&1 | grep -q '\[C-HANDOUT-MODE\]'; then
            echo "expected --lint NOT to flag C-HANDOUT-MODE once matched handout: pairs are present" >&2
            exit 1
          fi

  latex-fixtures:
    runs-on: ubuntu-latest
    # Ubuntu's own texlive packages are years behind and don't have ltx-talk
    # (needs a recent LaTeX kernel). Run inside the official TeX Live
    # container instead, which tracks current TeX Live / CTAN.
    container:
      image: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain versions
        run: |
          pdflatex --version | head -1
          lualatex --version | head -1
          kpsewhich ltx-talk.cls || (echo "::error::ltx-talk.cls not found - TeX Live image is too old"; exit 1)
          tlmgr info ltx-talk 2>/dev/null | grep -E 'cat-version' || true

      # poppler-utils provides pdfinfo (the Tagged flag) and pdftotext (the text
      # layer and -bbox geometry the fixture assertions measure). qpdf is how
      # they count structure elements and MathML payloads. The texlive/texlive
      # image ships none of them.
      - name: Install poppler-utils and qpdf
        run: apt-get update && apt-get install -y poppler-utils qpdf

      # Two font-level entries in the catalogue (C-GLYPH-MISSING, C-SYMBOL-FONT-TOUNICODE)
      # compile clean, report Tagged: yes and log nothing. One of them has no cheap signal at
      # all, so the only thing that sees it is a real PDF/UA-2 validator. veraPDF is a Java
      # app with no Debian package, installed here from its own unattended installer.
      #
      # Cost, measured: ~45-60s once per job for the JRE and the installer, then ~0.9s per
      # validation, and the suite makes four. The fixture assertions skip themselves when
      # verapdf is absent so contributors without it still get a green local suite -- which is
      # exactly why the version check at the end of this step matters: a broken install here
      # must fail the job, not quietly disable those assertions.
      - name: Install veraPDF (PDF/UA-2 validator)
        run: |
          set -e
          apt-get install -y default-jre-headless unzip curl
          curl -sSL https://software.verapdf.org/releases/verapdf-installer.zip -o /tmp/verapdf.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf
          cat > /tmp/auto-install.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>/opt/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="true"/>
              <pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          # The installer script's name has moved between releases, so find it rather than
          # hard-coding it.
          installer=$(find /tmp/verapdf -maxdepth 2 -type f \( -name 'verapdf-install' -o -name 'vera-install' \) | head -1)
          test -n "$installer" || (echo "::error::no veraPDF installer script found in the zip"; ls -R /tmp/verapdf; exit 1)
          chmod +x "$installer"
          "$installer" /tmp/auto-install.xml
          ln -sf /opt/verapdf/verapdf /usr/local/bin/verapdf
          verapdf --version || (echo "::error::verapdf installed but not runnable - the fixture UA-2 assertions would silently skip"; exit 1)

      # Runs before the fixtures, deliberately: the fixtures that measure pixels
      # are only as good as the probe, and #18 was a suite of assertions that
      # could not fail. Every positive check in the self-test is paired with the
      # inverted claim, which must be rejected. ~4s, of which ~3 is one lualatex
      # run; pdftoppm comes from the poppler-utils installed above.
      - name: Pixel probe self-test (tests/run_pixel_probe_selftest.sh)
        run: bash tests/run_pixel_probe_selftest.sh

      - name: Build and assert MWE fixtures (tests/fixtures/*/)
        run: bash tests/run_fixtures.sh
