# before.tex is the Beamer original, so pdfTeX; the ltx-talk variants must be lualatex
# (SKILL.md Step 3).
ENGINES_before="pdflatex"
ENGINES_after="lualatex"
ENGINES_naive="lualatex"

# Two passes. In a fresh directory one pass ships an extra "Temporary page! LaTeX was unable to
# guess the total number of pages correctly" page, so every page-count assertion is off by one.
PASSES=2

# The defect is invisible in the slides build -- fixed and broken are the same 2 pages with the
# same text. Build each variant a second time as a handout, where they differ, and assert on
# that output separately (assert-<variant>-handout.sh). The option is passed to whichever class
# the source itself names, so this one key covers the beamer before.tex too.
EXTRA_OUTPUTS="handout"
CLASS_OPTIONS_handout="handout"
