# C-PDFTEX-MATH is about the ENGINE, not the source: the same ltx-talk deck is
# correct under lualatex and corrupts the maths text layer under pdflatex. So
# each variant names its own engine, and the "naive" variant is the correct
# source built with the wrong engine.
ENGINES_before="pdflatex"    # the Beamer original: correct under pdfTeX
ENGINES_after="lualatex"     # ltx-talk, correct engine
ENGINES_naive="pdflatex"     # ltx-talk, wrong engine -- the defect

# MathML payloads are absent on pass 1 under every engine and appear once the
# build converges. A single-pass harness would "prove" lualatex no better than
# pdflatex, which is the trap the catalogue entry warns about.
PASSES=3
