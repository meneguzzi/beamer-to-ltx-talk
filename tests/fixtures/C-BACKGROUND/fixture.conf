# before.tex is the Beamer original, so pdfTeX; the ltx-talk variants must be lualatex
# (SKILL.md Step 3). Identical measurements either way for before.tex, checked.
ENGINES_before="pdflatex"
ENGINES_after="lualatex"
ENGINES_naive="lualatex"

# Two passes, or the ltx-talk variants ship a third-and-a-half page reading "Temporary page!
# LaTeX was unable to guess the total number of pages correctly" and every page index below
# is off. All three variants are 3 pages once converged.
PASSES=2
