# before.tex is the Beamer original, so pdfTeX; the ltx-talk variant must be
# lualatex (SKILL.md Step 3).
ENGINES_before="pdflatex"
ENGINES_after="lualatex"

# Two passes: the tagpdf para-hook balance is only checked at \end{document} of a
# complete run, and a single pass in a fresh directory also ships a "Temporary
# page!" page that moves every page index.
PASSES=2
